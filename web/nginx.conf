# Served by nginx-unprivileged (runs as non-root, listens on 8080).

# Reuse an incoming X-Request-ID, otherwise mint one. Passed to the API so
# nginx and API log lines for the same request share an ID.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

# Same level semantics as the API's request logs.
map $status $log_level {
  ~^5     error;
  ~^4     warn;
  default info;
}

log_format json escape=json
  '{"time":"$time_iso8601","level":"$log_level","service":"web",'
  '"reqId":"$req_id","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"upstreamDuration":"$upstream_response_time","ua":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  access_log /dev/stdout json;

  # Docker's embedded DNS. Resolving per request (via the variable below)
  # means nginx follows the API to its new IP after a redeploy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  gzip on;
  gzip_types text/css application/javascript application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /api/health {
    rewrite ^ /health break;
    proxy_pass $api_upstream;
    proxy_set_header X-Request-ID $req_id;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
    location ~* \.(css|js)$ {
      add_header Cache-Control "public, max-age=300";
    }
  }
}
