<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Notes</h1>
      <span id="version" class="version" title="API version"></span>
    </header>
    <form id="note-form">
      <input id="note-body" name="body" maxlength="500" placeholder="Write a note…" required autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="notes"></ul>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
