# Base stack shared by every environment.
#   local dev : docker compose up                      (auto-merges docker-compose.override.yml)
#   prod-like : docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#   + metrics : add -f docker-compose.monitoring.yml
name: notes

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # rotate container logs so they can't fill the disk
    max-file: "5"

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-notes}

x-api-build: &api-build
  context: ./api
  target: prod
  args:
    APP_VERSION: ${IMAGE_TAG:-local}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    logging: *logging

  # One-shot: applies pending migrations, then exits. The API waits for it.
  migrate:
    image: ${REGISTRY:-notes}/notes-api:${IMAGE_TAG:-local}
    build: *api-build
    command: ["node", "src/migrate.js"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [backend]
    logging: *logging

  api:
    image: ${REGISTRY:-notes}/notes-api:${IMAGE_TAG:-local}
    build: *api-build
    environment: *api-env
    init: true   # tini as PID 1: forwards SIGTERM, reaps zombies
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Readiness (checks the DB) rather than liveness: this gates deploys.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [backend, frontend]
    logging: *logging

  web:
    image: ${REGISTRY:-notes}/notes-web:${IMAGE_TAG:-local}
    build:
      context: ./web
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    logging: *logging

volumes:
  db-data:

networks:
  frontend:
  # No route to the outside world; only services attached here can reach the DB.
  backend:
    internal: true
