global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS discovery finds every API replica (docker compose --scale / replicas).
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
