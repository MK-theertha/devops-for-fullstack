# Each alert links to its section in docs/RUNBOOK.md.
groups:
  - name: notes-api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0 or absent(up{job="api"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API instance {{ $labels.instance }} is not being scraped"
          runbook: docs/RUNBOOK.md#apidown

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests are failing"
          runbook: docs/RUNBOOK.md#apihigherrorrate

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route=~"/api/.*"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 500ms"
          runbook: docs/RUNBOOK.md#apihighlatency

      - alert: ApiEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="api"} > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event loop p99 lag above 200ms on {{ $labels.instance }}"
          runbook: docs/RUNBOOK.md#apieventlooplag
