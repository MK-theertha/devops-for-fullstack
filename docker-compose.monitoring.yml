# Observability stack: metrics (Prometheus), logs (Alloy -> Loki), dashboards
# and alerts (Grafana). UIs bind to localhost only; reach them on a server via
#   ssh -L 3001:localhost:3001 -L 9090:localhost:9090 deploy@host
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks: [backend, monitoring]
    logging: *logging

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks: [monitoring]
    logging: *logging

  # Tails every container's stdout via the Docker API and pushes to Loki.
  alloy:
    image: grafana/alloy:v1.5.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped
    networks: [monitoring]
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, loki]
    restart: unless-stopped
    networks: [monitoring]
    logging: *logging

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  monitoring:
